name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ticket_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma validate

      - run: npm run lint

      - run: npm run openapi:lint

      - run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ticket_booking_test?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-chars!
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-chars!
          BCRYPT_ROUNDS: '12'
          NODE_ENV: test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

</parameter>